<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
          id="meta-description"
          name="description"
          content="Interactive 3D Quarto board game UI using Three.js and the Negamax version of the Minimax artificial
          intelligence algorithm with alpha-beta pruning. Play user vs user, user vs AI, and AI vs AI, with easy,
          medium and hard AI difficulties. A port of the Python UU-game 'game engine' component completed as part of an
          Agile software engineering project at Uppsala University; from CLI to static Web using typescript and vite."
  />
  <meta name="theme-color" content="#11151d" />
  <meta name="robots" content="index, follow" />
  <link
          rel="canonical"
          href="https://r055a.github.io/ai-quatro-3d/"
  />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AI-Quarto 3D" />
  <meta
          property="og:description"
          content="Interactive 3D Quarto board game. Play user vs user, user vs AI, and AI vs AI, with easy, medium and hard AI difficulties."
  />
  <meta
          property="og:url"
          content="https://r055a.github.io/ai-quatro-3d/"
  />
  <meta
          property="og:image"
          content="https://r055a.github.io/ai-quatro-3d/social-preview.png"
  />
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-96EN6VBJXM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(...args) {
      window.dataLayer.push(args);
    }
    gtag("js", new Date());
    gtag("config", "G-96EN6VBJXM");
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AI-Quarto 3D",
      "url": "https://r055a.github.io/ai-quarto-3d/"
    }
  </script>
  <title>AI-Quarto 3D</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <p id="eyebrow" class="eyebrow">A ported enhancement of Uni-Git-Projects/UU-Game (game engine)</p>
      <h1 id="app-title">AI-Quarto 3D</h1>
    </div>

    <div class="controls">
      <label id="diff-wrap">
        <span id="diff-label">AI difficulty</span>
        <select id="diff">
          <option value="easy" id="diff-easy">Easy</option>
          <option value="medium" id="diff-medium" selected>Medium</option>
          <option value="hard" id="diff-hard">Hard</option>
        </select>
      </label>
      <label id="diff-p-one-wrap" hidden>
        <span id="diff-p-one-label">AI-P1 difficulty</span>
        <select id="diff-p-one">
          <option value="easy" id="diff-p-one-easy">Easy</option>
          <option value="medium" id="diff-p-one-medium">Medium</option>
          <option value="hard" id="diff-p-one-hard" selected>Hard</option>
        </select>
      </label>
      <label id="diff-p-two-wrap" hidden>
        <span id="diff-p-two-label">AI-P2 difficulty</span>
        <select id="diff-p-two">
          <option value="easy" id="diff-p-two-easy">Easy</option>
          <option value="medium" id="diff-p-two-medium">Medium</option>
          <option value="hard" id="diff-p-two-hard" selected>Hard</option>
        </select>
      </label>
      <label>
        <span id="starter-label">Starting player</span>
        <select id="starter">
          <option value="random" id="starter-random" selected>Random</option>
          <option value="player1" id="starter-player-one">Player 1</option>
          <option value="player2" id="starter-player-two">Player 2</option>
        </select>
      </label>
      <label>
        <span id="game-mode-label">Game mode</span>
        <select id="game-mode">
          <option value="human-human" id="game-mode-user-vs-user">User vs user</option>
          <option value="human-ai" id="game-mode-user-vs-ai" selected>User vs AI</option>
          <option value="ai-ai" id="game-mode-only-ai">AI vs AI</option>
        </select>
      </label>
      <button id="new-game" class="primary" type="button">New game</button>
      <div class="util-controls">
        <div class="control-lang">
          <button
                  id="language-toggle"
                  class="lang-toggle"
                  type="button"
                  aria-haspopup="dialog"
                  aria-expanded="false"
                  aria-label="Language"
                  title="Language"
          >
            <svg
                    class="control-lang-icon"
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18"></path>
              <path d="M12 3c2.5 2.5 3.8 5.5 3.8 9S14.5 18.5 12 21"></path>
              <path d="M12 3c-2.5 2.5-3.8 5.5-3.8 9s1.3 6.5 3.8 9"></path>
            </svg>
            <span id="language-current">EN</span>
          </button>

          <div id="language-panel" class="lang-panel" hidden>
            <div class="lang-search">
              <input
                      id="language-search"
                      class="lang-search-input"
                      type="search"
                      aria-label="Search a locale"
                      placeholder="Search a locale"
                      autocomplete="off"
                      spellcheck="false"
              />
            </div>
            <ul id="language-list" class="lang-list" aria-label="Language list"></ul>
            <p id="language-empty" class="lang-empty" hidden>No language found</p>
          </div>
        </div>
        <a
                id="source-link"
                class="github-link"
                href="https://github.com/r055a/ai-quarto-3d"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="View source on GitHub"
                title="View source on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7a11.3 11.3 0 0 0-3.6 22c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.2-1.3-1.5-1.3-1.5-1-.7.1-.7.1-.7 1.2.1 1.8 1.3 1.8 1.3 1.1 1.8 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.5 1.2a12 12 0 0 1 6.4 0A4.8 4.8 0 0 1 18.7 5c.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1 .8 2v3c0 .3.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"></path>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="game-card">
    <section class="scene-wrap">
      <div class="hist-controls">
        <button
                id="undo"
                class="hist-button"
                type="button"
                aria-label="Undo"
                title="Undo"
                disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 7 4 12l5 5"></path>
            <path d="M5 12h8a6 6 0 0 1 6 6"></path>
          </svg>
        </button>
        <button
                id="redo"
                class="hist-button"
                type="button"
                aria-label="Redo"
                title="Redo"
                disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 7 5 5-5 5"></path>
            <path d="M19 12h-8a6 6 0 0 0-6 6"></path>
          </svg>
        </button>
      </div>
      <canvas id="game-canvas"></canvas>
      <div id="thinking" class="thinking" hidden>
        <span></span><span></span><span></span>
        <strong id="thinking-label">AI is playing</strong>
        <button
                id="ai-pause-toggle"
                class="thinking-toggle"
                type="button"
                aria-label="Pause AI"
                title="Pause AI"
        >
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 6v12M16 6v12"></path>
          </svg>
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 6 9 6-9 6Z"></path>
          </svg>
        </button>
      </div>
    </section>

    <aside class="side-panel" aria-live="polite">
      <div>
        <p id="turn-badge" class="turn-badge"></p>
        <h2 id="status">Gameplay status</h2>
        <p id="detail" class="detail"></p>
      </div>

      <div class="received-card">
        <span id="piece-in-play">Piece in play</span>
        <strong id="piece-name">None selected</strong>
        <code id="piece-str">----</code>
      </div>

      <div class="legend">
        <h3 id="piece-traits">Piece traits</h3>
        <div><code>1</code><span id="trait-black">black</span><span id="trait-big">big</span><span id="trait-round">round</span><span id="trait-solid">solid</span></div>
        <div><code>0</code><span id="trait-red">red</span><span id="trait-small">small</span><span id="trait-square">square</span><span id="trait-hollow">hollow</span></div>
      </div>

      <div class="bin-board-card">
        <div class="bin-board-heading">
          <h3 id="bin-board-title">Binary board</h3>
          <span id="bin-board-subtitle">Placed pieces</span>
        </div>
        <div class="bin-board-wrap">
          <div id="bin-board" class="bin-board">
            <code data-binary-cell="0"></code>
            <code data-binary-cell="1"></code>
            <code data-binary-cell="2"></code>
            <code data-binary-cell="3"></code>
            <code data-binary-cell="4"></code>
            <code data-binary-cell="5"></code>
            <code data-binary-cell="6"></code>
            <code data-binary-cell="7"></code>
            <code data-binary-cell="8"></code>
            <code data-binary-cell="9"></code>
            <code data-binary-cell="10"></code>
            <code data-binary-cell="11"></code>
            <code data-binary-cell="12"></code>
            <code data-binary-cell="13"></code>
            <code data-binary-cell="14"></code>
            <code data-binary-cell="15"></code>
          </div>
          <svg
                  id="bin-win-overlay"
                  class="bin-win-overlay"
                  viewBox="0 0 4 4"
                  aria-hidden="true"
                  hidden
          >
          </svg>
        </div>
      </div>

    </aside>
  </main>

  <footer></footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
